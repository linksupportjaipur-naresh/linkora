<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-labelledby="t">
  <title id="t">A Linkora profile page on a phone, with link clicks, a QR code and app icons around it</title>
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7955E8"/><stop offset="1" stop-color="#B79CFF"/></linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EDE7FF"/><stop offset=".55" stop-color="#FFFFFF"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#B79CFF"/><stop offset="1" stop-color="#7955E8"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#FFD6F0"/><stop offset="1" stop-color="#B79CFF"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0B0618" flood-opacity=".45"/></filter>
    <filter id="sh2" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0B0618" flood-opacity=".35"/></filter>
    <clipPath id="screenClip"><rect x="198" y="92" width="244" height="520" rx="30"/></clipPath>
  </defs>

  <!-- soft glow rings -->
  <circle cx="320" cy="360" r="300" fill="none" stroke="#FFFFFF" stroke-opacity=".06" stroke-width="2"/>
  <circle cx="320" cy="360" r="230" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="2"/>

  <!-- phone -->
  <g filter="url(#sh)">
    <rect x="186" y="80" width="268" height="544" rx="42" fill="#0E0920"/>
    <rect x="198" y="92" width="244" height="520" rx="30" fill="url(#scr)"/>
  </g>
  <g clip-path="url(#screenClip)">
    <rect x="198" y="92" width="244" height="128" fill="url(#hdr)"/>
    <circle cx="410" cy="110" r="60" fill="#FFFFFF" fill-opacity=".12"/>
  </g>
  <rect x="282" y="102" width="76" height="18" rx="9" fill="#0E0920"/>

  <!-- avatar -->
  <circle cx="320" cy="204" r="44" fill="url(#ring)"/>
  <circle cx="320" cy="204" r="38" fill="#1B1233"/>
  <text x="320" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="28" fill="#FFFFFF">AS</text>
  <text x="320" y="276" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="19" fill="#1B1233">Aanya Sharma</text>
  <text x="320" y="298" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#6B6384">Designer &amp; creator · Jaipur</text>

  <!-- social icons -->
  <g fill="#1B1233">
    <circle cx="286" cy="324" r="5"/><circle cx="308" cy="324" r="5"/><circle cx="330" cy="324" r="5"/><circle cx="352" cy="324" r="5"/>
  </g>

  <!-- link buttons -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13.5">
    <rect x="218" y="348" width="204" height="44" rx="22" fill="#7955E8"/>
    <circle cx="242" cy="370" r="11" fill="#FFFFFF" fill-opacity=".22"/>
    <path d="M239 364 L248 370 L239 376 Z" fill="#FFFFFF"/>
    <text x="330" y="375" text-anchor="middle" fill="#FFFFFF">Watch my latest video</text>

    <rect x="218" y="402" width="204" height="44" rx="22" fill="#FFFFFF" stroke="#E3DBFA" stroke-width="1.5"/>
    <circle cx="242" cy="424" r="11" fill="#EDE7FF"/>
    <path d="M237 421 h10 l-1.5 8 h-7 z" fill="#7955E8"/>
    <text x="330" y="429" text-anchor="middle" fill="#1B1233">Shop my presets</text>

    <rect x="218" y="456" width="204" height="44" rx="22" fill="#FFFFFF" stroke="#E3DBFA" stroke-width="1.5"/>
    <circle cx="242" cy="478" r="11" fill="#EDE7FF"/>
    <path d="M237 478 l4 4 l7 -8" fill="none" stroke="#7955E8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="330" y="483" text-anchor="middle" fill="#1B1233">Book a 1:1 call</text>

    <rect x="218" y="510" width="204" height="44" rx="22" fill="#FFFFFF" stroke="#E3DBFA" stroke-width="1.5"/>
    <circle cx="242" cy="532" r="11" fill="#E6FAF0"/>
    <path d="M236 537 l1.5 -4.5 a7 7 0 1 1 3 3 z" fill="#25D366"/>
    <text x="330" y="537" text-anchor="middle" fill="#1B1233">Chat on WhatsApp</text>
  </g>
  <rect x="270" y="574" width="100" height="22" rx="11" fill="#1B1233" fill-opacity=".07"/>
  <text x="320" y="589" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#6B6384">Made with Linkora</text>

  <!-- analytics card (left) -->
  <g filter="url(#sh2)">
    <rect x="22" y="150" width="190" height="150" rx="22" fill="#FFFFFF"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="42" y="182" font-size="12" fill="#6B6384">Link clicks this week</text>
    <text x="42" y="210" font-size="24" font-weight="700" fill="#1B1233">3,482</text>
    <rect x="132" y="192" width="50" height="22" rx="11" fill="#DDF7EA"/>
    <text x="157" y="207" text-anchor="middle" font-size="11.5" font-weight="700" fill="#157347">+18%</text>
    <rect x="42"  y="252" width="16" height="30" rx="5" fill="url(#bar)" opacity=".55"/>
    <rect x="66"  y="240" width="16" height="42" rx="5" fill="url(#bar)" opacity=".65"/>
    <rect x="90"  y="246" width="16" height="36" rx="5" fill="url(#bar)" opacity=".7"/>
    <rect x="114" y="228" width="16" height="54" rx="5" fill="url(#bar)" opacity=".8"/>
    <rect x="138" y="236" width="16" height="46" rx="5" fill="url(#bar)" opacity=".9"/>
    <rect x="162" y="222" width="16" height="60" rx="5" fill="url(#bar)"/>
  </g>

  <!-- QR card (right) -->
  <g filter="url(#sh2)">
    <rect x="456" y="420" width="156" height="176" rx="22" fill="#FFFFFF"/>
  </g>
  <g fill="#1B1233">
    <rect x="482" y="444" width="30" height="30" rx="5"/><rect x="489" y="451" width="16" height="16" rx="2" fill="#FFFFFF"/><rect x="493" y="455" width="8" height="8" rx="1"/>
    <rect x="556" y="444" width="30" height="30" rx="5"/><rect x="563" y="451" width="16" height="16" rx="2" fill="#FFFFFF"/><rect x="567" y="455" width="8" height="8" rx="1"/>
    <rect x="482" y="518" width="30" height="30" rx="5"/><rect x="489" y="525" width="16" height="16" rx="2" fill="#FFFFFF"/><rect x="493" y="529" width="8" height="8" rx="1"/>
    <rect x="522" y="446" width="8" height="8" rx="2"/><rect x="536" y="458" width="8" height="8" rx="2"/><rect x="522" y="470" width="8" height="8" rx="2"/>
    <rect x="484" y="490" width="8" height="8" rx="2"/><rect x="500" y="500" width="8" height="8" rx="2"/><rect x="522" y="486" width="8" height="8" rx="2"/>
    <rect x="538" y="496" width="8" height="8" rx="2" fill="#7955E8"/><rect x="556" y="486" width="8" height="8" rx="2"/><rect x="572" y="500" width="8" height="8" rx="2"/>
    <rect x="522" y="518" width="8" height="8" rx="2"/><rect x="538" y="530" width="8" height="8" rx="2"/><rect x="556" y="520" width="8" height="8" rx="2"/>
    <rect x="572" y="536" width="8" height="8" rx="2"/><rect x="522" y="540" width="8" height="8" rx="2"/><rect x="556" y="540" width="8" height="8" rx="2" fill="#7955E8"/>
  </g>
  <text x="534" y="578" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#1B1233">Scan to visit</text>

  <!-- floating chips -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13">
    <g filter="url(#sh2)"><rect x="452" y="128" width="150" height="46" rx="16" fill="#FFFFFF"/></g>
    <rect x="464" y="139" width="24" height="24" rx="8" fill="#E1306C"/>
    <circle cx="476" cy="151" r="5.5" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="498" y="156" fill="#1B1233">New reel live</text>

    <g filter="url(#sh2)"><rect x="470" y="262" width="138" height="46" rx="16" fill="#FFFFFF"/></g>
    <rect x="482" y="273" width="24" height="24" rx="8" fill="#7955E8"/>
    <path d="M494 291 c-6 -4 -8 -7 -8 -10 a4 4 0 0 1 8 -1 a4 4 0 0 1 8 1 c0 3 -2 6 -8 10z" fill="#FFFFFF"/>
    <text x="516" y="290" fill="#1B1233">2.4k taps</text>

    <g filter="url(#sh2)"><rect x="36" y="478" width="150" height="46" rx="16" fill="#FFFFFF"/></g>
    <rect x="48" y="489" width="24" height="24" rx="8" fill="#2BB673"/>
    <text x="60" y="506" text-anchor="middle" fill="#FFFFFF" font-size="14">₹</text>
    <text x="82" y="506" fill="#1B1233">UPI payment</text>
  </g>

  <!-- sparkles -->
  <g fill="#FFFFFF">
    <path d="M110 92 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4z" opacity=".8"/>
    <path d="M560 360 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3z" opacity=".7"/>
    <path d="M140 600 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3z" opacity=".6"/>
  </g>
</svg>
